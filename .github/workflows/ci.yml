name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: mysql://sfp:sfp@127.0.0.1:3306/sfp
          BETTER_AUTH_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci
          BETTER_AUTH_URL: http://localhost:3000
          ALLOW_SIGNUP: 'false'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          DATABASE_URL: mysql://sfp:sfp@127.0.0.1:3306/sfp
          BETTER_AUTH_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci
          BETTER_AUTH_URL: http://localhost:3000
          ALLOW_SIGNUP: 'false'
